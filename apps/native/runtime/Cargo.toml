[package]
name = "matou-native-runtime"
version = "0.3.2"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regress = { version = "=0.12.0", features = ["utf16"] }
encoding_rs = "=0.8.44"
flate2 = "=1.1.11"
ruzstd = "=0.9.0"
getrandom = "=0.4.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "tokio"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
async-channel = "2"
matou-native-core = { path = "../core" }
matou-native-terminal = { path = "../terminal" }
regex = "=1.13.1"
url = "=2.5.8"
percent-encoding = "=2.3.2"
serde_json = "1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "=1.54.1", features = ["net", "rt", "sync", "time"] }
toml = "=1.2.1"
tower-service = "=0.3.3"
tempfile = "3"
subtle = "=2.6.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
