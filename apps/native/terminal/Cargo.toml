[package]
name = "matou-native-terminal"
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regress = { version = "=0.12.0", features = ["utf16"] }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
