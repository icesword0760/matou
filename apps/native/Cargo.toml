[workspace]
members = ["core", "terminal", "runtime", "desktop"]
exclude = ["vendor/gpui"]
resolver = "2"

[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
