<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Matou · 主界面统一看板与设置</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #edf0f4;
      --canvas-2: #f4f6f8;
      --surface: rgba(255,255,255,.88);
      --surface-solid: #fff;
      --sidebar: rgba(246,248,250,.76);
      --line: rgba(71,83,99,.12);
      --line-strong: rgba(71,83,99,.18);
      --text: #303744;
      --muted: #7e8794;
      --faint: #a3aab4;
      --blue: #347fd6;
      --blue-soft: rgba(52,127,214,.11);
      --blue-line: rgba(52,127,214,.28);
      --shadow: 0 1px 2px rgba(28,38,52,.04),0 10px 28px rgba(44,58,77,.055);
      --font: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    }
    * { box-sizing: border-box; }
    html,body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: var(--font); background: #dfe3e8; color: var(--text); }
    button,input { font: inherit; }
    button { color: inherit; }
    .shell { display: grid; width: 100vw; height: 100vh; min-width: 980px; grid-template-columns: 258px minmax(0,1fr); overflow: hidden; background: var(--canvas); }

    /* The same quiet, translucent product sidebar as the main workspace. */
    .sidebar { position: relative; z-index: 2; display: grid; min-height: 0; grid-template-rows: 52px minmax(0,1fr) 44px; border-right: 1px solid rgba(74,88,106,.1); background: var(--sidebar); box-shadow: 8px 0 30px rgba(51,64,81,.055),inset -1px 0 rgba(255,255,255,.72); backdrop-filter: blur(22px) saturate(1.05); }
    .sidebar::before { position: absolute; content: ""; inset: 0; z-index: -1; opacity: .36; background: radial-gradient(260px 210px at 38% 14%,rgba(255,255,255,.82),transparent 72%); pointer-events: none; }
    .window-title { display: flex; align-items: center; gap: 12px; padding: 0 14px; }
    .traffic { display: flex; gap: 7px; }
    .traffic i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.1); }
    .traffic i:nth-child(2) { background: #ffbd2e; }
    .traffic i:nth-child(3) { background: #28c840; }
    .brand { display: flex; align-items: center; gap: 8px; margin-left: 2px; font-size: 13px; font-weight: 650; letter-spacing: -.1px; }
    .brand svg { width: 15px; height: 15px; color: #657180; }
    .workspace-list { min-height: 0; padding: 15px 8px; overflow: auto; }
    .workspace { margin-bottom: 17px; }
    .workspace-head { display: flex; height: 31px; align-items: center; gap: 8px; padding: 0 9px; color: #5b6573; font-size: 12px; font-weight: 650; }
    .workspace-head .chev { color: #a1a8b1; font-size: 10px; }
    .workspace-head svg { width: 14px; color: #738293; }
    .workspace-head span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-head small { margin-left: auto; color: #9da5af; }
    .task { position: relative; display: flex; width: 100%; height: 36px; align-items: center; gap: 8px; padding: 0 10px 0 27px; border: 0; border-radius: 8px; background: transparent; color: #6d7581; cursor: pointer; font-size: 12px; text-align: left; }
    .task:hover { background: rgba(70,82,99,.05); }
    .task.active { color: #343b46; background: rgba(77,91,111,.085); font-weight: 550; }
    .task.active::before { position: absolute; content: ""; top: 8px; bottom: 8px; left: 8px; width: 2px; border-radius: 9px; background: #3e88df; }
    .task svg { width: 13px; color: #8c95a0; }
    .sidebar-tools { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-top: 1px solid rgba(78,91,107,.09); }
    .sidebar-tools button { display: flex; height: 30px; align-items: center; gap: 7px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: #6d7784; cursor: pointer; font-size: 12px; font-weight: 550; }
    .sidebar-tools button:hover { background: rgba(63,77,95,.06); color: #343c48; }
    .sidebar-tools button.active { color: #2e7ece; background: var(--blue-soft); box-shadow: inset 0 0 0 1px rgba(52,127,214,.11); }
    .sidebar-tools svg { width: 14px; height: 14px; }

    .workspace-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); }
    .scene-tabs { display: flex; height: 52px; align-items: center; gap: 5px; padding: 0 12px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.68); backdrop-filter: blur(16px); }
    .scene-tab { display: flex; min-width: 140px; height: 34px; align-items: center; justify-content: space-between; padding: 0 11px; border-radius: 8px; background: rgba(91,105,123,.075); color: #707987; font-size: 11px; }
    .scene-tab.active { background: rgba(255,255,255,.9); color: #3b4350; box-shadow: 0 1px 4px rgba(37,48,64,.08); }
    .scene-tab b { font-weight: 600; }
    .scene-tab span { color: #9ca4af; }
    .scene-plus { display: grid; width: 29px; height: 29px; place-items: center; border: 0; border-radius: 7px; background: rgba(83,96,113,.07); color: #828b98; }
    .stage-content { position: absolute; inset: 52px 0 0; overflow: hidden; }
    .shell.settings .scene-tabs { display: none; }
    .shell.settings .stage-content { inset: 0; }

    /* Board direction: one calm canvas, status is metadata rather than surface color. */
    .board-page { display: grid; height: 100%; grid-template-rows: 68px minmax(0,1fr); padding: 0 18px 16px; animation: page-in 180ms ease-out both; }
    .page-head { display: flex; align-items: center; justify-content: space-between; }
    .page-title { display: flex; align-items: baseline; gap: 9px; }
    .page-title h1 { margin: 0; color: #333b47; font-size: 17px; font-weight: 680; letter-spacing: -.25px; }
    .page-title span { color: #9098a3; font-size: 11px; }
    .page-guide { display: flex; align-items: center; gap: 8px; color: #8b949f; font-size: 11px; }
    .page-guide svg { width: 14px; color: #738194; }
    .board-columns { display: grid; min-width: 840px; min-height: 0; grid-template-columns: repeat(4,minmax(192px,1fr)); gap: 11px; }
    .column { --tone:#8e98a5; display: grid; min-height: 0; grid-template-rows: 42px minmax(0,1fr); overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: rgba(250,251,252,.66); box-shadow: inset 0 1px rgba(255,255,255,.72); transition: border-color 140ms ease,background 140ms ease; }
    .column[data-status="active"] { --tone:#d29a35; }
    .column[data-status="blocked"] { --tone:#d26762; }
    .column[data-status="completed"] { --tone:#589a70; }
    .column.drop { border-color: var(--blue-line); background: rgba(241,247,254,.78); }
    .column-head { display: flex; align-items: center; gap: 7px; padding: 0 11px; border-bottom: 1px solid rgba(73,87,105,.08); color: #4f5966; }
    .column-head i { width: 7px; height: 7px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb,var(--tone) 13%,transparent); }
    .column-head strong { font-size: 12px; font-weight: 650; }
    .column-head span { color: #969da7; font-size: 10px; }
    .cards { min-height: 0; padding: 8px; overflow: auto; }
    .board-card { position: relative; margin-bottom: 7px; padding: 11px; border: 1px solid rgba(67,80,97,.105); border-radius: 9px; background: rgba(255,255,255,.94); box-shadow: 0 1px 2px rgba(34,45,60,.035); cursor: grab; transition: transform 140ms ease-out,box-shadow 140ms ease-out,border-color 140ms ease; }
    .board-card:hover { transform: translateY(-1px); border-color: rgba(65,81,102,.17); box-shadow: var(--shadow); }
    .board-card.selected { border-color: rgba(53,127,214,.27); box-shadow: inset 2px 0 #3c87dc,0 5px 18px rgba(47,93,148,.08); }
    .board-card.dragging { opacity: .38; transform: scale(.975); }
    .board-card h2 { margin: 0 0 12px; color: #3b4350; font-size: 12px; font-weight: 600; line-height: 1.4; }
    .board-card footer { display: flex; align-items: center; justify-content: space-between; color: #9299a3; font-size: 10px; }
    .board-card footer span { display: flex; align-items: center; gap: 5px; }
    .board-card footer svg { width: 12px; }
    .board-card footer b { padding: 2px 5px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); font-size: 9px; font-weight: 600; }
    .empty { padding-top: 24px; color: #a8afb8; font-size: 10px; text-align: center; }
    .toast { position: fixed; z-index: 30; bottom: 21px; left: calc(50% + 129px); padding: 8px 11px; border: 1px solid rgba(55,72,92,.13); border-radius: 8px; background: rgba(255,255,255,.94); box-shadow: 0 12px 30px rgba(41,55,73,.14); color: #596372; font-size: 11px; transform: translateX(-50%); animation: toast-in 160ms ease-out both; }

    /* Settings direction: same surfaces and density as terminal panes, not an admin dashboard. */
    .settings-page { display: grid; height: 100%; grid-template-columns: 176px minmax(0,1fr); animation: page-in 180ms ease-out both; }
    .settings-nav { padding: 22px 10px; border-right: 1px solid var(--line); background: rgba(246,248,250,.54); backdrop-filter: blur(16px); }
    .settings-label { display: block; margin: 0 10px 8px; color: #98a0aa; font-size: 9px; font-weight: 700; letter-spacing: .09em; }
    .settings-nav button { display: flex; width: 100%; height: 34px; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: #66717e; cursor: pointer; font-size: 11px; font-weight: 600; text-align: left; }
    .settings-nav button.active { color: #2f7fd4; background: var(--blue-soft); }
    .settings-nav svg { width: 14px; }
    .settings-nav p { margin: 10px 10px 0; color: #9ba2ac; font-size: 9px; line-height: 1.55; }
    .settings-main { min-width: 0; min-height: 0; padding: 24px 28px 28px; overflow: auto; }
    .settings-heading { display: flex; align-items: flex-start; justify-content: space-between; }
    .settings-heading h1 { margin: 0; color: #333b47; font-size: 19px; font-weight: 680; letter-spacing: -.35px; }
    .settings-heading p { margin: 5px 0 0; color: #9098a4; font-size: 10px; }
    .close { display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 7px; background: rgba(72,86,105,.06); color: #9099a4; cursor: pointer; font-size: 16px; }
    .close:hover { background: rgba(72,86,105,.1); color: #4b5562; }
    .segments { display: inline-flex; margin: 23px 0 17px; padding: 3px; border: 1px solid rgba(72,85,102,.07); border-radius: 9px; background: rgba(86,98,114,.065); }
    .segments button { height: 29px; padding: 0 15px; border: 0; border-radius: 6px; background: transparent; color: #7a8491; cursor: pointer; font-size: 10px; font-weight: 600; }
    .segments button.active { background: rgba(255,255,255,.94); color: #38414d; box-shadow: 0 1px 3px rgba(39,52,69,.1); }
    .active-provider { display: grid; min-height: 59px; grid-template-columns: 32px minmax(0,1fr) auto; align-items: center; gap: 11px; padding: 0 13px; border: 1px solid var(--blue-line); border-radius: 9px; background: rgba(241,247,254,.74); }
    .provider-logo { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 8px; color: #fff; background: #c67a49; font-size: 12px; font-weight: 700; }
    .provider-logo.open { background: #555f6a; }
    .provider-logo.custom { background: #7487a1; }
    .provider-copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
    .provider-copy strong { overflow: hidden; color: #414a57; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .provider-copy span { overflow: hidden; color: #8b95a1; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .active-provider > b { padding: 3px 6px; border-radius: 5px; color: #357dc9; background: rgba(53,125,201,.085); font-size: 8px; font-weight: 650; }
    .providers-head { display: flex; align-items: center; justify-content: space-between; margin: 19px 0 7px; }
    .providers-head h2 { margin: 0; color: #4a5360; font-size: 12px; font-weight: 650; }
    .providers-head h2 span { margin-left: 4px; color: #989fa9; font-size: 9px; font-weight: 500; }
    .primary { height: 29px; padding: 0 11px; border: 0; border-radius: 7px; background: #3b83d4; color: #fff; cursor: pointer; font-size: 9px; font-weight: 650; box-shadow: 0 4px 12px rgba(52,117,191,.15); }
    .provider-list { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.74); }
    .provider-row { display: grid; min-height: 62px; grid-template-columns: 32px minmax(150px,1.1fr) minmax(125px,.8fr) auto; align-items: center; gap: 11px; padding: 0 12px; border-bottom: 1px solid rgba(72,85,102,.085); }
    .provider-row:last-child { border-bottom: 0; }
    .provider-row.current { background: rgba(244,248,253,.8); box-shadow: inset 2px 0 #3f87d7; }
    .provider-model { display: flex; flex-direction: column; gap: 3px; }
    .provider-model strong { color: #4e5865; font-size: 10px; }
    .provider-model span { color: #999fa8; font-size: 8px; }
    .row-actions { display: flex; gap: 5px; }
    .row-actions button { height: 27px; padding: 0 9px; border: 1px solid rgba(74,88,105,.12); border-radius: 6px; background: rgba(255,255,255,.72); color: #697482; cursor: pointer; font-size: 9px; }
    .row-actions button:hover { background: #fff; color: #38424f; }
    .row-actions button.use { border-color: rgba(53,127,214,.18); color: #347fd6; background: rgba(52,127,214,.075); }
    .row-actions button:disabled { color: #a1a8b1; background: rgba(79,92,109,.055); cursor: default; }
    .impact { display: flex; align-items: center; gap: 5px; margin: 10px 2px 0; color: #929aa5; font-size: 8px; line-height: 1.5; }
    .impact b { color: #78828e; }

    .modal-layer { position: fixed; z-index: 50; inset: 0; display: none; place-items: center; background: rgba(45,54,66,.2); backdrop-filter: blur(4px); }
    .modal-layer.open { display: grid; }
    .modal { width: 410px; overflow: hidden; border: 1px solid rgba(67,80,97,.16); border-radius: 12px; background: rgba(255,255,255,.97); box-shadow: 0 22px 60px rgba(39,52,70,.2); animation: modal-in 180ms ease-out both; }
    .modal header { display: flex; height: 47px; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .modal header button { border: 0; background: transparent; color: #929aa5; font-size: 17px; cursor: pointer; }
    .modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
    .modal-body label { display: grid; gap: 5px; color: #687380; font-size: 9px; }
    .modal-body label.wide { grid-column: 1/-1; }
    .modal-body input { width: 100%; height: 33px; padding: 0 9px; border: 1px solid rgba(66,81,101,.16); border-radius: 7px; outline: 0; color: #3c4652; background: #fff; font-size: 10px; }
    .modal-body input:focus { border-color: rgba(52,127,214,.52); box-shadow: 0 0 0 3px rgba(52,127,214,.09); }
    .modal footer { display: flex; height: 52px; align-items: center; justify-content: flex-end; gap: 7px; padding: 0 16px; border-top: 1px solid var(--line); }
    .modal footer button { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: #687380; cursor: pointer; font-size: 10px; }
    .modal footer button.save { border-color: #3b83d4; background: #3b83d4; color: #fff; }

    @keyframes page-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    @keyframes modal-in { from { opacity: 0; transform: scale(.975) translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%,6px); } to { opacity: 1; transform: translate(-50%,0); } }
    @media (max-width: 1120px) {
      .shell { grid-template-columns: 224px minmax(0,1fr); }
      .board-page { padding-right: 12px; padding-left: 12px; }
      .board-columns { gap: 8px; }
      .provider-row { grid-template-columns: 30px minmax(120px,1fr) auto; }
      .provider-model { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell board" id="shell">
    <aside class="sidebar">
      <div class="window-title">
        <span class="traffic"><i></i><i></i><i></i></span>
        <span class="brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18V6l8-3 8 3v12l-8 3z"/><path d="m4 6 8 3 8-3M12 9v12"/></svg>
          新增工作空间
        </span>
      </div>
      <div class="workspace-list">
        <section class="workspace">
          <div class="workspace-head"><span class="chev">⌄</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v9H3z"/></svg><span>matou_workspace</span><small>⌁</small></div>
          <button class="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M7 12h10M9 17h6"/></svg>新事项 3</button>
          <button class="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M7 12h10M9 17h6"/></svg>新事项 2</button>
          <button class="task active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M7 12h10M9 17h6"/></svg>Git 控制器</button>
          <button class="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M7 12h10M9 17h6"/></svg>默认</button>
        </section>
        <section class="workspace">
          <div class="workspace-head"><span class="chev">⌄</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v9H3z"/></svg><span>AIWriteX</span><small>＋ ···</small></div>
          <button class="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M7 12h10M9 17h6"/></svg>默认</button>
        </section>
        <section class="workspace">
          <div class="workspace-head"><span class="chev">⌄</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v9H3z"/></svg><span>Baize-Translation</span><small>＋ ···</small></div>
          <button class="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M7 12h10M9 17h6"/></svg>翻译流程</button>
        </section>
      </div>
      <div class="sidebar-tools">
        <button id="boardButton" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14M15 5v14"/></svg>看板
        </button>
        <button id="settingsButton">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6l-.05.08h-4l-.05-.08a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1l-.08-.05v-4L4 9.9a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06L7.06 4.1l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6l.05-.08h4l.05.08a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 9c.08.39.3.74.6 1l.08.05v4L20 14a1.7 1.7 0 0 0-.6 1z"/></svg>设置
        </button>
      </div>
    </aside>

    <main class="workspace-stage">
      <div class="scene-tabs">
        <div class="scene-tab active"><b>Git 控制器</b><span>×</span></div>
        <div class="scene-tab"><b>默认</b><span>×</span></div>
        <button class="scene-plus">＋</button>
      </div>
      <div class="stage-content" id="stage"></div>
    </main>
  </div>

  <div class="modal-layer" id="modalLayer">
    <section class="modal">
      <header><strong>新增供应商</strong><button data-close-modal>×</button></header>
      <div class="modal-body">
        <label>供应商名称<input value="团队代理" /></label>
        <label>默认模型<input value="claude-opus-5" /></label>
        <label class="wide">API 地址<input value="https://api.example.com" /></label>
        <label class="wide">API Key<input type="password" value="example-token" /></label>
      </div>
      <footer><button data-close-modal>取消</button><button class="save" id="saveProvider">保存配置</button></footer>
    </section>
  </div>

  <template id="boardTemplate">
    <section class="board-page">
      <header class="page-head">
        <div class="page-title"><h1>matou_workspace 看板</h1><span id="taskTotal">7 个事项</span></div>
        <div class="page-guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 5h8M8 12h8M8 19h8"/><circle cx="5" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="19" r="1"/></svg>拖动事项以更新状态</div>
      </header>
      <div class="board-columns">
        <section class="column" data-status="planned"><header class="column-head"><i></i><strong>就绪</strong><span class="count">（2）</span></header><div class="cards">
          <article class="board-card selected" draggable="true"><h2>Git 分支与 Worktree 控制器</h2><footer><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="9"/></svg>1 个会话</span><b>当前</b></footer></article>

  <template id="settingsTemplate">
    <section class="settings-page">
      <nav class="settings-nav">
        <span class="settings-label">AI 服务</span>
        <button class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>模型切换</button>
        <p>供应商切换为全局设置，将同步影响所有 Matou 窗口。</p>
      </nav>
      <main class="settings-main">
        <header class="settings-heading"><div><h1>模型切换</h1><p>配置命令行工具使用的供应商，并设置全局默认。</p></div><button class="close" id="closeSettings">×</button></header>
        <div class="segments"><button class="active" data-cli="claude">Claude Code</button><button data-cli="codex">Codex</button></div>
        <section class="active-provider"><span class="provider-logo" id="activeLogo">A</span><div class="provider-copy"><strong id="activeName">Anthropic 官方</strong><span id="activeMeta">CLI 默认 · api.anthropic.com</span></div><b>全局使用中</b></section>
        <div class="providers-head"><h2>供应商 <span id="providerCount">2 个配置</span></h2><button class="primary" id="addProvider">＋ 新增供应商</button></div>
        <div class="provider-list" id="providerList">
          <article class="provider-row current" data-provider="Anthropic 官方" data-meta="CLI 默认 · api.anthropic.com" data-logo="A">
            <span class="provider-logo">A</span><div class="provider-copy"><strong>Anthropic 官方</strong><span>api.anthropic.com</span></div><div class="provider-model"><strong>CLI 默认</strong><span>默认模型</span></div><div class="row-actions"><button>编辑</button><button disabled>当前配置</button></div>
          </article>
          <article class="provider-row" data-provider="团队代理" data-meta="claude-opus-5 · api.example.com" data-logo="T">
            <span class="provider-logo custom">T</span><div class="provider-copy"><strong>团队代理</strong><span>api.example.com</span></div><div class="provider-model"><strong>claude-opus-5</strong><span>默认模型 · Key 已配置</span></div><div class="row-actions"><button>编辑</button><button class="use">切换</button></div>
          </article>
        </div>
        <p class="impact"><span>ⓘ</span><b>切换会影响所有 Matou 窗口。</b>现有会话按工具能力更新，新会话直接使用最新配置。</p>
      </main>
    </section>
  </template>

  <script>
    const shell = document.getElementById('shell');
    const stage = document.getElementById('stage');
    const boardButton = document.getElementById('boardButton');
    const settingsButton = document.getElementById('settingsButton');
    const modalLayer = document.getElementById('modalLayer');
    let dragged = null;

    function showBoard() {
      shell.className = 'shell board';
      boardButton.classList.add('active'); settingsButton.classList.remove('active');
      stage.replaceChildren(document.getElementById('boardTemplate').content.cloneNode(true));
      wireBoard();
    }
    function showSettings() {
      shell.className = 'shell settings';
      settingsButton.classList.add('active'); boardButton.classList.remove('active');
      stage.replaceChildren(document.getElementById('settingsTemplate').content.cloneNode(true));
      wireSettings();
    }
    function wireBoard() {
      stage.querySelectorAll('.board-card').forEach(card => {
        card.addEventListener('click', () => {
          stage.querySelectorAll('.board-card').forEach(item => item.classList.remove('selected'));
          card.classList.add('selected');
        });
        card.addEventListener('dragstart', () => { dragged = card; requestAnimationFrame(() => card.classList.add('dragging')); });
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); dragged = null; stage.querySelectorAll('.column').forEach(c => c.classList.remove('drop')); });
      });
      stage.querySelectorAll('.column').forEach(column => {
        column.addEventListener('dragover', event => { event.preventDefault(); column.classList.add('drop'); });
        column.addEventListener('dragleave', event => { if (!column.contains(event.relatedTarget)) column.classList.remove('drop'); });
        column.addEventListener('drop', event => {
          event.preventDefault(); column.classList.remove('drop');
          if (!dragged) return;
          column.querySelector('.cards').appendChild(dragged);
          updateCounts(); showToast(`事项已移至「${column.querySelector('strong').textContent}」`);
        });
      });
    }
    function updateCounts() {
      stage.querySelectorAll('.column').forEach(column => {
        column.querySelector('.count').textContent = `（${column.querySelectorAll('.board-card').length}）`;
      });
    }
    function wireSettings() {
      document.getElementById('closeSettings').onclick = showBoard;
      document.getElementById('addProvider').onclick = () => modalLayer.classList.add('open');
      stage.querySelectorAll('.segments button').forEach(button => button.onclick = () => {
        stage.querySelectorAll('.segments button').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        const codex = button.dataset.cli === 'codex';
        document.getElementById('activeLogo').textContent = codex ? 'O' : 'A';
        document.getElementById('activeLogo').className = `provider-logo${codex ? ' open' : ''}`;
        document.getElementById('activeName').textContent = codex ? 'OpenAI 官方' : 'Anthropic 官方';
        document.getElementById('activeMeta').textContent = codex ? 'CLI 默认 · api.openai.com' : 'CLI 默认 · api.anthropic.com';
      });
      wireProviderActions();
    }
    function wireProviderActions() {
      stage.querySelectorAll('.provider-row .use').forEach(button => button.onclick = () => {
        const row = button.closest('.provider-row');
        stage.querySelectorAll('.provider-row').forEach(item => {
          item.classList.remove('current');
          const action = item.querySelector('.row-actions button:last-child');
          action.disabled = false; action.className = 'use'; action.textContent = '切换';
        });
        row.classList.add('current'); button.disabled = true; button.className = ''; button.textContent = '当前配置';
        document.getElementById('activeLogo').textContent = row.dataset.logo;
        document.getElementById('activeLogo').className = row.querySelector('.provider-logo').className;
        document.getElementById('activeName').textContent = row.dataset.provider;
        document.getElementById('activeMeta').textContent = row.dataset.meta;
        showToast(`已切换为 ${row.dataset.provider}`);
      });
    }
    function showToast(text) {
      document.querySelector('.toast')?.remove();
      const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = text; document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }
    boardButton.onclick = showBoard;
    settingsButton.onclick = showSettings;
    document.querySelectorAll('[data-close-modal]').forEach(button => button.onclick = () => modalLayer.classList.remove('open'));
    modalLayer.onclick = event => { if (event.target === modalLayer) modalLayer.classList.remove('open'); };
    document.getElementById('saveProvider').onclick = () => { modalLayer.classList.remove('open'); showToast('供应商配置已保存'); };
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && modalLayer.classList.contains('open')) modalLayer.classList.remove('open');
      else if (event.key === 'Escape' && shell.classList.contains('settings')) showBoard();
    });
    showBoard();
  </script>
</body>
</html>
